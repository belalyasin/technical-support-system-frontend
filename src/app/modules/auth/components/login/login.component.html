<form
  class="form w-100"
  [formGroup]="loginForm"
  novalidate="novalidate"
  id="kt_login_signin_form"
  (ngSubmit)="submit()"
>
  <div class="text-center mb-10">
    <h1 class="text-dark mb-3">Sign in to Technical Support</h1>
    <div class="text-gray-400 fw-bold fs-4">
      New here?
      <a routerLink="/auth/registration" id="kt_login_signup" class="link-primary fw-bolder">
        Create an account
      </a>
    </div>
  </div>

  <div class="mb-10 alert alert-success" *ngIf="notice && !errorMessage" data-testid="login-notice">
    {{ notice }}
  </div>
  <div class="mb-10 alert alert-danger" *ngIf="errorMessage" data-testid="login-error">
    {{ errorMessage }}
  </div>

  <div class="fv-row mb-10">
    <label class="form-label fs-6 fw-bolder text-dark">Email</label>
    <input
      class="form-control form-control-lg form-control-solid"
      type="email"
      name="email"
      formControlName="email"
      autocomplete="username"
      [ngClass]="{ 'is-invalid': f.email.invalid && (f.email.dirty || f.email.touched) }"
    />
    <div class="fv-plugins-message-container" *ngIf="f.email.invalid && (f.email.dirty || f.email.touched)">
      <span role="alert">Enter a valid email address.</span>
    </div>
  </div>

  <div class="fv-row mb-10">
    <div class="d-flex flex-stack mb-2">
      <label class="form-label fw-bolder text-dark fs-6 mb-0">Password</label>
      <a routerLink="/auth/forgot-password" class="link-primary fs-6 fw-bolder" id="kt_login_forgot">
        Forgot password?
      </a>
    </div>
    <input
      class="form-control form-control-lg form-control-solid"
      type="password"
      name="password"
      autocomplete="current-password"
      formControlName="password"
      [ngClass]="{ 'is-invalid': f.password.invalid && (f.password.dirty || f.password.touched) }"
    />
    <div class="fv-plugins-message-container" *ngIf="f.password.invalid && (f.password.dirty || f.password.touched)">
      <span role="alert">The password has at least 6 characters.</span>
    </div>
  </div>

  <div class="text-center">
    <button type="submit" id="kt_sign_in_submit" class="btn btn-lg btn-primary w-100 mb-5" [disabled]="isLoading">
      <span class="indicator-label" *ngIf="!isLoading">Sign in</span>
      <span class="indicator-progress" [style.display]="'block'" *ngIf="isLoading">
        Please wait...
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </button>
  </div>
</form>
