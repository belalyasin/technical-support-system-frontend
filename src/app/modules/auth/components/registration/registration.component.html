<form
  class="form w-100"
  novalidate="novalidate"
  id="kt_login_signup_form"
  [formGroup]="registrationForm"
  (ngSubmit)="submit()"
>
  <div class="mb-10 text-center">
    <h1 class="text-dark mb-3">Create an account</h1>
    <div class="text-gray-400 fw-bold fs-4">
      Already have an account?
      <a routerLink="/auth/login" class="link-primary fw-bolder">Sign in</a>
    </div>
  </div>

  <div class="mb-10 alert alert-danger" *ngIf="errorMessage" data-testid="register-error">
    {{ errorMessage }}
  </div>

  <div class="fv-row mb-7">
    <label class="form-label fw-bolder text-dark fs-6">Full name</label>
    <input
      class="form-control form-control-lg form-control-solid"
      type="text"
      name="name"
      formControlName="name"
      autocomplete="name"
      [ngClass]="{ 'is-invalid': showError('name') }"
    />
    <div class="fv-plugins-message-container" *ngIf="showError('name')">
      <span role="alert">Enter your name (at least 3 characters).</span>
    </div>
  </div>

  <div class="fv-row mb-7">
    <label class="form-label fw-bolder text-dark fs-6">Email</label>
    <input
      class="form-control form-control-lg form-control-solid"
      type="email"
      name="email"
      formControlName="email"
      autocomplete="email"
      [ngClass]="{ 'is-invalid': showError('email') }"
    />
    <div class="fv-plugins-message-container" *ngIf="showError('email')">
      <span role="alert">Enter a valid email address.</span>
    </div>
  </div>

  <div class="fv-row mb-7">
    <label class="form-label fw-bolder text-dark fs-6">Phone</label>
    <input
      class="form-control form-control-lg form-control-solid"
      type="tel"
      name="phone"
      formControlName="phone"
      autocomplete="tel"
      [ngClass]="{ 'is-invalid': showError('phone') }"
    />
    <div class="fv-plugins-message-container" *ngIf="showError('phone')">
      <span role="alert">Enter 10 to 15 digits.</span>
    </div>
  </div>

  <div class="fv-row mb-7">
    <label class="form-label fw-bolder text-dark fs-6">Password</label>
    <input
      class="form-control form-control-lg form-control-solid"
      type="password"
      name="password"
      formControlName="password"
      autocomplete="new-password"
      [ngClass]="{ 'is-invalid': showError('password') }"
    />
    <div class="fv-plugins-message-container" *ngIf="showError('password')">
      <span role="alert">Use at least 6 characters.</span>
    </div>
  </div>

  <div class="fv-row mb-10">
    <label class="form-label fw-bolder text-dark fs-6">Repeat password</label>
    <input
      class="form-control form-control-lg form-control-solid"
      type="password"
      name="cPassword"
      formControlName="cPassword"
      autocomplete="new-password"
      [ngClass]="{ 'is-invalid': showError('cPassword') }"
    />
    <div class="fv-plugins-message-container" *ngIf="showError('cPassword')">
      <span role="alert">The two passwords do not match.</span>
    </div>
  </div>

  <div class="text-center">
    <button type="submit" id="kt_sign_up_submit" class="btn btn-lg btn-primary w-100 mb-5" [disabled]="isLoading">
      <span class="indicator-label" *ngIf="!isLoading">Create account</span>
      <span class="indicator-progress" [style.display]="'block'" *ngIf="isLoading">
        Please wait...
        <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
      </span>
    </button>
  </div>
</form>
