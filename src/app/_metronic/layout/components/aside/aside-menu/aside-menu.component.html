<!-- Conversations -->
<div class="menu-item">
  <a class="menu-link without-sub" routerLink="/support/conversations" routerLinkActive="active">
    <span class="menu-icon">
      <span
        [inlineSVG]="'./assets/media/icons/duotune/communication/com012.svg'"
        class="svg-icon svg-icon-2"
      ></span>
    </span>
    <span class="menu-title">Conversations</span>
  </a>
</div>

<ng-container *ngIf="isStaff$ | async">
  <div class="menu-item">
    <div class="menu-content pt-8 pb-2">
      <span class="menu-section text-muted text-uppercase fs-8 ls-1">Support team</span>
    </div>
  </div>

  <!-- Quick replies -->
  <div class="menu-item">
    <a class="menu-link without-sub" routerLink="/support/quick-replies" routerLinkActive="active">
      <span class="menu-icon">
        <span
          [inlineSVG]="'./assets/media/icons/duotune/general/gen005.svg'"
          class="svg-icon svg-icon-2"
        ></span>
      </span>
      <span class="menu-title">Quick replies</span>
    </a>
  </div>

  <!-- Users -->
  <div class="menu-item">
    <a class="menu-link without-sub" routerLink="/support/users" routerLinkActive="active">
      <span class="menu-icon">
        <span
          [inlineSVG]="'./assets/media/icons/duotune/communication/com006.svg'"
          class="svg-icon svg-icon-2"
        ></span>
      </span>
      <span class="menu-title">Users</span>
    </a>
  </div>
</ng-container>

<div class="menu-item">
  <div class="menu-content pt-8 pb-2">
    <span class="menu-section text-muted text-uppercase fs-8 ls-1">Account</span>
  </div>
</div>

<!-- My account -->
<div class="menu-item">
  <a class="menu-link without-sub" routerLink="/support/account" routerLinkActive="active">
    <span class="menu-icon">
      <span
        [inlineSVG]="'./assets/media/icons/duotune/general/gen019.svg'"
        class="svg-icon svg-icon-2"
      ></span>
    </span>
    <span class="menu-title">My account</span>
  </a>
</div>
