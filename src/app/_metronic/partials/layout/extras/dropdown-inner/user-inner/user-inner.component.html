<ng-container *ngIf="user$ | async as _user">
  <div class="menu-item px-3">
    <div class="menu-content d-flex align-items-center px-3">
      <div class="symbol symbol-50px me-5">
        <span class="symbol-label bg-light-primary text-primary fs-3 fw-bolder">
          {{ _user.name.charAt(0).toUpperCase() }}
        </span>
      </div>

      <div class="d-flex flex-column">
        <div class="fw-bolder d-flex align-items-center fs-5" data-testid="menu-user-name">
          {{ _user.name }}
          <span class="badge badge-light-success fw-bolder fs-8 px-2 py-1 ms-2">
            {{ roleLabel(_user.roles) }}
          </span>
        </div>
        <span class="fw-bold text-muted fs-7">{{ _user.email }}</span>
      </div>
    </div>
  </div>

  <div class="separator my-2"></div>

  <div class="menu-item px-5">
    <a routerLink="/support/account" class="menu-link px-5">My account</a>
  </div>

  <div class="menu-item px-5">
    <a (click)="logout()" class="menu-link px-5 cursor-pointer" data-testid="sign-out">Sign out</a>
  </div>
</ng-container>
